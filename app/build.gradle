plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prprmayuyu.sudoku'
    compileSdk 36

    defaultConfig {
        applicationId 'com.prprmayuyu.sudoku'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def generatedSudokuAssets = layout.buildDirectory.dir('generated/sudokuAssets').get().asFile
def expectedHtmlSha256 = 'ccbaed20a2784873aacf548e35a12a58b70bcdeb2273d16aa14e739162a11226'

tasks.register('generateSudokuAssets') {
    inputs.files(fileTree('src/main/html-parts'))
    outputs.dir(generatedSudokuAssets)

    doLast {
        generatedSudokuAssets.mkdirs()
        def encoded = (1..5).collect { n ->
            file("src/main/html-parts/index.part${n}.b64").getText('UTF-8').trim()
        }.join('')
        def htmlBytes = java.util.Base64.getDecoder().decode(encoded)
        def actualSha = java.security.MessageDigest.getInstance('SHA-256')
            .digest(htmlBytes)
            .collect { String.format('%02x', it & 0xff) }
            .join('')
        if (actualSha != expectedHtmlSha256) {
            throw new GradleException("Sudoku HTML checksum mismatch: ${actualSha}")
        }
        new File(generatedSudokuAssets, 'index.html').bytes = htmlBytes
    }
}

android.sourceSets.main.assets.srcDir(generatedSudokuAssets)
tasks.named('preBuild').configure { dependsOn('generateSudokuAssets') }
